<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadinGames</title>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Jaini&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="learning-points-badge">
    <style>
        #learning-points-badge {
            position: fixed;
            top: 72px;
            right: 32px;
            background-color: white;
            border: 3px solid #bbb;
            border-radius: 10px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            font-family: 'Jaini', cursive;
            font-size: 26px;
            color: #ff751f;
        }

        #learning-points-badge img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }
    </style>
    <img src="../LearningP.png" alt="Learning Points Icon">
    <span id="LP">LP</span>
</div>
    <div id="loggedin">
        <nav>
            <ul>
                <li class="nav-item">
                    <a href="/public/loggedin/"><img src="ReadinGames.png" alt="Home Page button"></a>
                </li>
                <li class="nav-item active-page"><a href="/public/loggedin/practice">Practice</a></li>
                <li class="nav-item"><a href="/public/loggedin/games">Games</a></li>
                <li class="nav-item"><a href="/public/loggedin/shop">Shop</a></li>
                <li class="nav-item"><a href="/public/loggedin/favourites">Favourites</a></li>
                <li class="nav-item"><a href="/public/loggedin/submit">Submit</a></li>
                <li class="nav-item"><a href="/public/loggedin/profile"><img src="defaultpfp.png" alt="Profile Picture" id="profileimg">Profile</a></li>
            </ul>
        </nav>
        
        <div id="home-view" class="view">
            <div id="finder">
                <h1>Find Problems</h1>
                <label for="grade" id="category">Grade:</label>
                <select name="grade" id="grade">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                </select>
                <label for="categories" id="category">Category:</label>
                <select name="categories" id="cars">
                <option value="main-idea">Main Idea</option>
                <option value="theme">Theme</option>
                <option value="inference">Inference</option>
                <option value="volcabulary-in-context">Volcabulary in Context</option>
                <option value="author's-purpose">Author's Purpose</option>
                <option value="point-of-view">Point of View</option>
                <option value="supporting-evidence">Supporting Evidence</option>
                <option value="character-traits">Character Traits</option>
                <option value="cause-and-effect">Cause and Effect</option>
                <option value="sequence-of-events">Sequence of Events</option>
                </select>
                <input type="text" id="keyword" placeholder="keyword">
                <button id="search">Search</button>
            </div>
            
            <div id="Readings">
                <h1>Readings</h1>
                <div id="readings-wrapper" style="position: relative;">
                    <!-- Loading overlay is now a sibling to the list, trapped inside the wrapper box -->
                    
                    <ul id="readingslist"></ul>

                </div>
            </div>
        </div>    
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
