<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Jaini&display=swap" rel="stylesheet">
    <style>
        /* Full screen overlay to center the spinner */
        .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(255, 255, 255, 0.9);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        }

        /* Spinner base container */
        .clock-spinner {
        position: relative;
        width: 80px;
        height: 80px;
        }

        /* Base style for every rounded rectangle */
        .clock-spinner .bar {
        position: absolute;
        left: 37px; /* Centers the 6px wide bar inside the 80px container */
        top: 0;
        width: 6px;
        height: 20px;
        border-radius: 3px; /* Makes the rectangle rounded */
        background-color: #e0e0e0; /* Default light gray color */
        transform-origin: 3px 40px; /* Forces rotation around the center of the clock */
        animation: fadeToGreen 1.2s linear infinite;
        }

        /* Position and animation delays for all 12 bars */
        .clock-spinner .bar:nth-child(1)  { transform: rotate(0deg);   animation-delay: -1.1s; }
        .clock-spinner .bar:nth-child(2)  { transform: rotate(30deg);  animation-delay: -1.0s; }
        .clock-spinner .bar:nth-child(3)  { transform: rotate(60deg);  animation-delay: -0.9s; }
        .clock-spinner .bar:nth-child(4)  { transform: rotate(90deg);  animation-delay: -0.8s; }
        .clock-spinner .bar:nth-child(5)  { transform: rotate(120deg); animation-delay: -0.7s; }
        .clock-spinner .bar:nth-child(6)  { transform: rotate(150deg); animation-delay: -0.6s; }
        .clock-spinner .bar:nth-child(7)  { transform: rotate(180deg); animation-delay: -0.5s; }
        .clock-spinner .bar:nth-child(8)  { transform: rotate(210deg); animation-delay: -0.4s; }
        .clock-spinner .bar:nth-child(9)  { transform: rotate(240deg); animation-delay: -0.3s; }
        .clock-spinner .bar:nth-child(10) { transform: rotate(270deg); animation-delay: -0.2s; }
        .clock-spinner .bar:nth-child(11) { transform: rotate(300deg); animation-delay: -0.1s; }
        .clock-spinner .bar:nth-child(12) { transform: rotate(330deg); animation-delay: 0s; }

        /* The color changing animation */
        @keyframes fadeToGreen {
        0% {
            background-color: #27ae60; /* Deeper shade of green */
        }
        100% {
            background-color: #e0e0e0; /* Fades back to light gray */
        }
        }


        :root {
            --sidebar-length: 60vh;
            --dot-size: 20px;
            --accent: rgb(0, 175, 38);
        }
        body { margin: 0; height: 100vh; background: #ddd; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .container { display: flex; gap: 80px; z-index: 1; }
        h1 { font-family: 'ADLaM Display', cursive; margin: 0; }
        
        .outline-title { 
            font-size: 80px; 
            color: white; 
            /* Simulate outside stroke by stacking shadows in all directions */
            text-shadow: 
                6px 6px 0 var(--accent), 
                -6px -6px 0 var(--accent), 
                6px -6px 0 var(--accent), 
                -6px 6px 0 var(--accent),
                6px 0 0 var(--accent), 
                -6px 0 0 var(--accent), 
                0 6px 0 var(--accent), 
                0 -6px 0 var(--accent);
        }

        /* For the Green text with Green "Outside" stroke */
        .outline-login { 
            font-size: 80px; 
            color: var(--accent); 
            text-shadow: 
                1px 1px 0 var(--accent), 
                -1px -1px 0 var(--accent), 
                1px -1px 0 var(--accent), 
                -1px 1px 0 var(--accent);
        }

        /* For the Jaini list items (White with Green "Outside" stroke) */
        .list-item { 
            font-family: 'Jaini', cursive; 
            font-size: 50px; 
            color: white; 
            text-shadow: 
                3px 3px 0 var(--accent), 
                -3px -3px 0 var(--accent), 
                3px -3px 0 var(--accent), 
                -3px 3px 0 var(--accent);
        }
        /* Sidebar Styles */
        .left { position: relative; }
        .sidebar { position: absolute; left: -30px; top: 0; width: 10px; background-color: var(--accent); animation: sidebar-morph 7s ease-in-out infinite; transform-origin: top; }
        .sliding-dot { position: absolute; width: var(--dot-size); height: var(--dot-size); background-color: var(--accent); border-radius: 50%; left: 50%; transform: translateX(-50%); animation: dot-slide 3s ease-in-out infinite; }
        
        @keyframes sidebar-morph {
            0%, 10% { height: 0px; top: 0; }
            33% { height: var(--sidebar-length); top: 10%; }
            66% { height: var(--sidebar-length); bottom: 10%; }
            90%, 100% { height: 0px; bottom: 0; }
        }
        @keyframes dot-slide {
            0%, 100% { top: 0; opacity: 1; }
            33% { opacity: 0; }
            66% { top: calc(100% - var(--dot-size)); }
            70% { opacity: 1; }
        }

        .right { display: flex; flex-direction: column; justify-content: center; }
        input { margin: 10px 0; padding: 15px; border: 3px solid var(--accent); font-size: 25px; }
        input[type="text"]:focus {
            outline: none; 
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 20px;
            font-size: 1.5rem;
            text-decoration: none;
            font-family: 'ADLaM Display';
            display: block;
            margin: 20px auto;
            padding-left: 10%;
            padding-right: 10%;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        button:hover {
            background-color: white;
            color: var(--accent);
        }

        
        .floating { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .floater { position: absolute; opacity: 0.6; width: 60px; }
        .float1 { top: 50px; left: 50%; animation: floatVertical 5s ease-in-out infinite alternate; }
        .float2 { top: 5%; left: 10%; animation: floatHorizontal 6s ease-in-out infinite alternate; }
        .float3 { top: 80%; left: 30%; animation: floatVertical 6s ease-in-out infinite alternate; }
        .float4 { top: 13%; left: 83%; animation: floatHorizontal 7s ease-in-out infinite alternate; }
        .float5 { top: 67%; left: 0%; animation: floatVertical 10s ease-in-out infinite alternate; }

        @keyframes floatVertical { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(15deg); } }
        @keyframes floatHorizontal { 0%, 100% { transform: translateX(0) translateY(0); } 50% { transform: translateX(-40px) translateY(-15px); } }
    </style>
</head>
<body>
    <div id="login">
        <div class="container">
            <div class="left">
                <h1 class="outline-title">Why log in?</h1>
                <div class="sidebar"><div class="sliding-dot"></div></div>
                <ul style="list-style: none; padding: 0;">
                    <li class="list-item">Personalized learning</li>
                    <li class="list-item">Track achievements</li>
                    <li class="list-item">Recommendations</li>
                    <li class="list-item">Game Features</li>
                    <li class="list-item">No repeats</li>
                </ul>
                <div class="placeholder"></div>
            </div>
            <div class="right">
                <h1 class="outline-login">Log in/Sign Up</h1>
                <input type="text" placeholder="Username" id="Username" required>
                <input type="text" placeholder="Password" id="Password" required>
                <p  style="color: red; margin-top: 0px;" id="warning" hidden>*A minimum of 6 digits is required for the password</p>
                <p  style="color: red; margin-top: 0px;" id="warning2" hidden>*The username or password is likely incorrect</p>
                <button type="submit" id="btn">Log In</button>
            </div>
            <div id="loadingScreen" class="loading-overlay">
                <div class="clock-spinner">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </div>
        <div class="floating">
            <img src="paperplane-removebg-preview.png" class="floater float1">
            <img src="book-removebg-preview.png" class="floater float2">
            <img src="stars-removebg-preview.png" class="floater float3">
            <img src="stars__1_-removebg-preview.png" class="floater float4">
            <img src="pencil-removebg-preview.png" class="floater float5">
        </div>
    </div>
    
    <script type="module">
        import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyBHmjiEPPbZtfYDMQeyRYLg3wO8fGPO4iE",
            authDomain: "readingames.firebaseapp.com",
            projectId: "readingames",
            storageBucket: "readingames.firebasestorage.app",
            messagingSenderId: "135626039621",
            appId: "1:135626039621:web:d0020d4265120de011de2c",
            measurementId: "G-YXT9CZ6597"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const analytics = getAnalytics(app);
        const db = getFirestore(app)

        let btn = document.getElementById('btn')
        btn.addEventListener("click",handlelogin)
        
        async function handlelogin() {
            const username = document.getElementById('Username').value;
            const password = document.getElementById('Password').value;
            const email = `${username}@readin.games`;

            try {
                document.getElementById('loadingScreen').style.display = 'flex'; 
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('loadingScreen').style.display = 'none'; 
                console.log('SUCCESS!');
                window.location.href = "./loggedin";
            } catch (error) {
                try {
                    document.getElementById('loadingScreen').style.display = 'flex'; 
                    const usercred = await createUserWithEmailAndPassword(auth, email, password);
                    document.getElementById('loadingScreen').style.display = 'none'; 
                    await setDoc(doc(db, "users", usercred.user.uid), {
                        grade: 0,
                        username: username,
                        lastlogin: serverTimestamp(),
                        joined: serverTimestamp(),
                        achievements: [],
                        readings: [],
                        games: [],
                        categories: [],
                        streak: 0
                    });
                    console.log('Account created!');
                    window.location.href = "loggedin.html";
                } catch (createError) {
                    if (createError.code === 'auth/weak-password') {
                        document.getElementById('warning').hidden = false;
                        document.getElementById('warning2').hidden = true;
                        document.getElementById('loadingScreen').style.display = 'none'; 
                    } else {
                        document.getElementById('warning').hidden = true;
                        document.getElementById('warning2').hidden = false;
                        document.getElementById('loadingScreen').style.display = 'none'; 
                    }
                }
            }
        }
        
    </script>
        
</body>
</html>
